<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 — Virtualized</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Silkscreen&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/assets/css/site.css">
<style>
  .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding-block: 64px; }
  .nf .wrap { display: grid; gap: 22px; justify-items: center; }
  .nf .mark { width: 180px; }
  .nf h1 { font-size: clamp(64px, 14vw, 160px); letter-spacing: -.06em; font-weight: 700; }
  .nf .lead { margin-inline: auto; }
</style>
</head>
<body>
<main class="nf" data-slop="5">
  <div class="wrap">
    {{MARK:nf}}
    <span class="eyebrow">Error 404</span>
    <h1 class="grad-text">404</h1>
    <p class="lead">This page has been virtualized by PVA. It still exists — seamlessly, securely, and at scale — just not anywhere you can see it.</p>
    <a class="btn btn-primary" href="/">Return to physical reality</a>
    <p class="fine">If you believe this is an error, it is. If you believe this is not an error, it is also that.</p>
  </div>
</main>
</body>
</html>
